; =====================================================================================================
;  TWAU Widescreen - settings
;  Everything works out of the box: this file only holds overrides. Change a value, save, restart the game.
;  1 = on, 0 = off. Lines starting with ; are notes.
;
;  LINUX / STEAM DECK (Proton): set the game's Steam launch options to
;      WINEDLLOVERRIDES="dinput8=n,b" %command%
;  (Steam > right-click the game > Properties > General > Launch Options). Windows needs nothing.
; =====================================================================================================

[General]
; Master switch for the whole mod.
Enabled=1
; TWAUWidescreen.log next to the game:
;   0 = off | 1 = normal (what the mod did, short) | 2 = detailed (everything - for bug reports)
Log=1
; Log file name (folders are created; relative = inside the game folder). Tokens:
;   {datetime} {date} {time} {version} = mod version, {gameversion} = 2026.6.12.2153,
;   {gamebuild} = store build id, {store} = steam/gog/epic/unknown, {level} = normal/detailed
LogFile=TWAUWidescreen/logs/{datetime}_v{version}.log
; How many logs to keep in that folder (oldest deleted first; 0 = keep all).
LogKeep=10


[Display]
; Picture shape: auto = your screen. Or force one: 21:9, 32:9, 2.39 ...
AspectRatio=auto
; Show every resolution your monitor supports (the game only lists 16:9 sizes).
AllResolutions=1
; Never let the game shrink the picture to 16:9 with black bars.
Block16x9=1


[Startup]
; Skip the logos and "click to begin" and go straight to the main menu.
SkipToMenu=1


[AntiAliasing]
; taa (best) | smaa | fxaa | none | game
Mode=taa
; Edge smoothing quality for TAA: 8x | 4x | 2x | none | game
TAAJitter=8x
; Texture sharpening with TAA: 0 = none (softer, no shimmer) | 1 | 2 = game (sharp)
Sharpening=0
; Tip: the in-game anti-aliasing switch adds extra blur on top - try it off.


[Speed]
; Optional extra, off by default. 1 = on, 0 = completely off.
Enabled=0
; Speed up the game with a key (F1-F12, a letter or digit).
Key=F7
; toggle = press to switch on/off | hold = only while the key is held
Mode=toggle
; How fast: 2.0 = double speed (max 10). Pauses are left alone.
Factor=3.0


[Screenshots]
; Optional extra, off by default. 1 = on, 0 = completely off.
Enabled=0
; Press for a comparison image with three panels:
;   1 the original game as it looked (16:9 stretched to your screen)
;   2 the original at its correct 16:9 shape (the extra widescreen area shown dimmed)
;   3 the fix
; The game freezes for a moment (panels 1-2 use the game's own anti-aliasing).
; With a FOV zoom set, panels 1-2 show the zoomed view.
Key=F8
; Folder (relative = inside the game folder).
Folder=TWAUWidescreen/shots
; Width of the comparison image in pixels (larger screens are scaled down).
Width=5120
; Also save the three pictures separately (full size).
SaveSingles=1


[Camera]
; Field of view: 1.0 = normal, 1.1 = 10% wider (zoomed out), 0.9 = zoomed in.
FOV=1.0

; Optional: a different FOV for one kind of shot (blank = use FOV above).
FOVExplore=
FOVCutscene=
FOVDialogue=
FOVOther=
; Menus, HUD and effects stay at 1.0 unless set here (zooming them shows their edges).
FOVMenu=
FOVUI=
FOVEffects=

; Keep mirror reflections at the shape they were made for.
MirrorsAt16x9=1


[UI]
; Put the inventory at the real screen edge instead of the 16:9 edge.
HUDAtScreenEdges=1
; Keep the loading spinner round.
FixLoadingIcon=1
; Menu edge frames: stretch (fit your screen) | hide | game
MenuEdgeFrames=stretch
; Hide any other UI pieces by name, comma-separated (names are in the log).
HideAgents=


[Dev]
; The game's leftover developer menus (F1 debug menu, Settings > Debug Options,
; Pause > Unlock Chapters). Back up your saves first.
DebugMenus=0


; =====================================================================================================
;  ADVANCED - you can ignore everything below
; =====================================================================================================

[CameraOverrides]
; FOV for one camera by name (names are in the log), e.g.
;cam_nav_street=1.3


[Prefs]
; The engine's hidden render settings: remove the ; to use one. Game defaults shown.
;Render - DOF Quality=2
;Render - Bokeh Quality=3
;Render - HBAO Quality=3
;Render - HBAO Resolution=1
;HBAO Intensity Scale=1.0
;Allow HBAO=true
;Render - Shadow MSAA Count=2
;Render - Level Intensity=1.0
;Render - Level White Point=1.0
;Render - Level Black Point=0.0
;Render - TAA Jitter Scale=1.0
;Enable V-Sync=true
;Force Load Full Textures=false
;
; Full list (also usable): Render - Antialiasing, Render - TAA Jitter, Render - TAA Mip Bias,
; Render - TAA Frame Time Threshold, Render - Bokeh Occlusion Type, Render - Max New DoF Blur Radius
; High/Medium/Low, Render - New DoF Blur Clamp Rescale, Render - Use MRT DOF, Render - Use Unrolled DOF,
; Render - DOF Near/Far Gauss Width HQ/MQ/LQ, Render - HBAO Platform Preset,
; Render - HBAO Deinterleaving Type, Render - Allow Wrap Shadowed Lights,
; Render - Ambient Light Apply Specular, Legacy Light Limits, Render - Glow Quality, Text Leading Fix
